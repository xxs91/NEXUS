function showNodes(){ $('sheetTitle').textContent=chosenRegion.flag+' '+chosenRegion.name;countries.classList.add('hidden');nodes.classList.remove('hidden');nodes.innerHTML='<div class="back-line" id="backCountries">‹ 所有地区</div>'+chosenRegion.nodes.map((n,i)=>`<div class="node-item" data-node="${i}"><span class="node-copy"><b>${n[0]}</b><small>示例节点 · 尚无实时数据</small></span><span class="latency">${n[1]}</span><span class="selected-check">${n===chosenNode&&chosenRegion===window.prevRegion?'✓':'›'}</span></div>`).join('');$('backCountries').onclick=showCountries;nodes.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>{chosenNode=chosenRegion.nodes[+el.dataset.node];$('selectedRegion').textContent=chosenRegion.flag+' '+chosenRegion.name;$('selectedNode').textContent=chosenNode[0];$('nodeLatency').textContent=chosenNode[1]==='—'?'—':chosenNode[1];sheet.classList.add('hidden');$('connectState').textContent='尚未连接';$('connectDetail').textContent='已选择节点 · 演示模式';demoConnected=false;$('connectBtn').textContent='连接'})}

const {data:{session}}=await sb.auth.getSession();if(session?.user){user=session.user;await loadApp()}sb.auth.onAuthStateChange((_event,session)=>{if(session?.user){user=session.user;loadApp()}else if(!user)showApp(false)});
</script></body></html>
