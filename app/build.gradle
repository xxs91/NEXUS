plugins {
    id 'com.android.application'
}

def nexusKeystorePath = System.getenv('NEXUS_KEYSTORE_PATH')
def nexusKeystorePassword = System.getenv('NEXUS_KEYSTORE_PASSWORD')
def nexusKeyAlias = System.getenv('NEXUS_KEY_ALIAS')
def nexusKeyPassword = System.getenv('NEXUS_KEY_PASSWORD')

android {
    namespace 'com.nexus.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nexus.app'
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName "1.0.8"
    }

    signingConfigs {
        release {
            if (nexusKeystorePath && nexusKeystorePassword && nexusKeyAlias && nexusKeyPassword) {
                storeFile file(nexusKeystorePath)
                storePassword nexusKeystorePassword
                keyAlias nexusKeyAlias
                keyPassword nexusKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (nexusKeystorePath && nexusKeystorePassword && nexusKeyAlias && nexusKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
