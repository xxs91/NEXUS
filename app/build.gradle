plugins {
    id 'com.android.application'
}

// Release signing is enabled only when the CI signing environment is present.
// The CI workflow validates the keystore, passwords and alias before building.
def nexusKeystorePath = System.getenv('NEXUS_KEYSTORE_PATH')
def nexusKeystorePassword = System.getenv('NEXUS_KEYSTORE_PASSWORD')
def nexusKeyAlias = System.getenv('NEXUS_KEY_ALIAS')
def nexusKeyPassword = System.getenv('NEXUS_KEY_PASSWORD')
def nexusSigningEnabled = nexusKeystorePath && nexusKeystorePassword && nexusKeyAlias && nexusKeyPassword

android {
    namespace 'com.nexus.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nexus.app'
        minSdk 24
        targetSdk 36
        versionCode 20
        versionName "1.0.19"
    }

    if (nexusSigningEnabled) {
        signingConfigs {
            release {
                storeFile file(nexusKeystorePath)
                storePassword nexusKeystorePassword
                keyAlias nexusKeyAlias
                keyPassword nexusKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (nexusSigningEnabled) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
}
