name: NEXUS - Merge Project and Build APK

'on':
  workflow_dispatch:
    inputs:
      update_zip:
        description: Select the merged update package
        required: true
        type: choice
        options:
          - NEXUS-1.0.1-merged.zip

permissions:
  contents: write

concurrency:
  group: nexus-apk-build
  cancel-in-progress: false

jobs:
  merge-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract merged project
        shell: bash
        env:
          ZIP_FILE: ${{ inputs.update_zip }}
        run: |
          set -euo pipefail
          test -f "$ZIP_FILE"
          mkdir -p /tmp/nexus-merged
          unzip -q -o "$ZIP_FILE" -d /tmp/nexus-merged

          SOURCE_DIR=""
          while IFS= read -r dir; do
            if [[ -f "$dir/package.json" ]] && \
               [[ -f "$dir/capacitor.config.json" ]] && \
               [[ -f "$dir/settings.gradle" ]] && \
               [[ -d "$dir/app" ]]; then
              SOURCE_DIR="$dir"
              break
            fi
          done < <(find /tmp/nexus-merged -type f -name package.json -printf '%h\n')

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "ERROR: Complete NEXUS project not found in ZIP."
            find /tmp/nexus-merged -maxdepth 4 -type f | head -100
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

      - name: Check project configuration
        run: |
          set -euo pipefail
          node -e "
          const p = require('./package.json');
          if (!p.dependencies?.['@capacitor/core']) throw new Error('Missing Capacitor Core');
          if (!p.dependencies?.['@capacitor/android']) throw new Error('Missing Capacitor Android');
          "
          test -f capacitor.config.json
          test -d dist

      - name: Update project version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p = Path("app/build.gradle")
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 3', s, count=1)
          s, n2 = re.subn(r"""versionName\s+['"][^'"]+['"]""", 'versionName "1.0.2"', s, count=1)

          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not update Android version.")

          p.write_text(s)

          package = Path("package.json")
          data = json.loads(package.read_text())
          data["version"] = "1.0.2"
          package.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Save merged project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Integrate NEXUS 1.0.2 project"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build

      - name: Add Android platform and sync
        run: |
          set -euo pipefail
          if [[ ! -f android/capacitor.settings.gradle ]]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 3', s, count=1)
          s, n2 = re.subn(r"""versionName\s+['"][^'"]+['"]""", 'versionName "1.0.2"', s, count=1)

          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not update generated Android version.")

          p.write_text(s)
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
