name: NEXUS - Auto Extract and Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: nexus-apk-build
  cancel-in-progress: false

jobs:
  extract-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 只处理本次提交新增或修改的 ZIP
      # 手动运行时不扫描历史 ZIP
      - name: Detect newly uploaded ZIP
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "手动启动：直接使用当前项目源码构建。"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
          fi

          if [[ -z "$BEFORE" ]]; then
            echo "无法确定本次提交的变更范围。"
            exit 1
          fi

          mapfile -t ZIP_FILES < <(
            git diff --name-only "$BEFORE" "$AFTER" \
              | grep -Ei '^[^/]+\.zip$' || true
          )

          if [[ ${#ZIP_FILES[@]} -eq 0 ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "本次没有上传 ZIP，使用现有源码构建。"
            exit 0
          fi

          if [[ ${#ZIP_FILES[@]} -gt 1 ]]; then
            echo "本次上传了多个 ZIP，请一次上传一个更新包。"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip_file=${ZIP_FILES[0]}" >> "$GITHUB_OUTPUT"

          echo "本次更新包：${ZIP_FILES[0]}"

      # 自动解压并识别项目目录
      - name: Extract NEXUS update
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.detect.outputs.zip_file }}"

          mkdir -p /tmp/nexus-package
          unzip -q -o "$ZIP_FILE" -d /tmp/nexus-package

          SOURCE_DIR=""

          while IFS= read -r dir; do
            if [[ -f "$dir/package.json" ]] && \
               [[ -f "$dir/settings.gradle" ]] && \
               [[ -d "$dir/app" ]]; then
              SOURCE_DIR="$dir"
              break
            fi
          done < <(
            find /tmp/nexus-package \
              -type f -name package.json -printf '%h\n'
          )

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "错误：没有找到有效的 NEXUS Android 项目。"
            find /tmp/nexus-package -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "识别到项目目录：$SOURCE_DIR"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

          rm -f "$ZIP_FILE"

      # 处理之前遇到的已知构建配置问题
      - name: Check Android build configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle ]]; then
            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle
          fi

          if [[ -f app/build.gradle ]] && \
             grep -q 'dependencies[[:space:]]*{' app/build.gradle && \
             ! grep -q 'androidx.appcompat:appcompat' app/build.gradle; then

            sed -i \
              "/dependencies[[:space:]]*{/a\\    implementation 'androidx.appcompat:appcompat:1.7.1'" \
              app/build.gradle
          fi

          echo "Android 配置检查完成。"

      # 只有文件发生变化才提交
      - name: Save updated project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update NEXUS project"
            git push
          else
            echo "没有需要提交的项目变化。"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
