name: NEXUS - Auto Detect and Build APK

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -name 'NEXUS-*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-)

          if [[ -z "$ZIP" ]]; then
            echo "No NEXUS-*.zip found in repository root."
            exit 1
          fi

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          echo "Selected ZIP: $ZIP"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/nexus-package
          unzip -q "$ZIP_PATH" -d /tmp/nexus-package

          PROJECT_DIR=$(find /tmp/nexus-package \
            -type f \
            -name package.json \
            -printf '%h\n' \
            | while read -r DIR; do
                if [[ -f "$DIR/settings.gradle" || -f "$DIR/settings.gradle.kts" ]] \
                  && [[ -f "$DIR/app/build.gradle" ]] \
                  && [[ -d "$DIR/app/src/main" ]]; then
                  echo "$DIR"
                  break
                fi
              done)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Could not find a valid NEXUS Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

          rsync -a --delete \
            --exclude='.git/' \
            "$PROJECT_DIR/" ./

      - name: Verify project version
        shell: bash
        run: |
          set -euo pipefail

          node -e "const p=require('./package.json'); console.log('package.json version:',p.version)"

          if ! grep -q 'versionName' app/build.gradle; then
            echo "versionName not found in app/build.gradle"
            exit 1
          fi

          grep 'versionName' app/build.gradle

      - name: Save merged project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update NEXUS project from ZIP"
            git push
          else
            echo "No project changes to save."
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Verify web project
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Restore NEXUS signing key
        shell: bash
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$NEXUS_KEYSTORE_BASE64" ]]; then
            echo "NEXUS_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/nexus-release.jks"

          printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "NEXUS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Signing key restored."

      - name: Build Android APK with fixed signature
        shell: bash
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$NEXUS_KEYSTORE_PASSWORD" || -z "$NEXUS_KEY_ALIAS" || -z "$NEXUS_KEY_PASSWORD" ]]; then
            echo "One or more signing secrets are missing."
            exit 1
          fi

          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "APK file not found."
            exit 1
          fi

          ls -lh "$APK"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK/build-tools" ]]; then
            echo "Android SDK Build Tools directory not found: $SDK/build-tools"
            exit 1
          fi

          APKSIGNER=$(find "$SDK/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          if [[ -z "$APKSIGNER" ]]; then
            echo "apksigner was not found."
            exit 1
          fi

          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
