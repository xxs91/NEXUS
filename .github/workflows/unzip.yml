name: NEXUS - Auto Detect and Build Signed APK

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - 'app/**'
      - '.github/workflows/unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'NEXUS-*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [[ -z "$ZIP" ]]; then
            echo "No NEXUS-*.zip found."
            exit 1
          fi
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          echo "Selected ZIP: $ZIP"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-package
          unzip -q "$ZIP_PATH" -d /tmp/nexus-package
          PROJECT_DIR=$(find /tmp/nexus-package -type f -name package.json -printf '%h\n' |
            while read -r DIR; do
              if [[ -f "$DIR/settings.gradle" || -f "$DIR/settings.gradle.kts" ]] && [[ -f "$DIR/app/build.gradle" ]] && [[ -d "$DIR/app/src/main" ]]; then
                echo "$DIR"
                break
              fi
            done)
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Could not find a valid Android project."
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          # Keep the repository-controlled version and release-signing configuration.
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='/app/build.gradle' --exclude='/package.json' --exclude='/index.html' --exclude='/dist/index.html' --exclude='/app/src/main/assets/public/index.html' --exclude='/app/src/main/AndroidManifest.xml' --exclude='/app/src/main/java/com/nexus/app/MainActivity.java' --exclude='/app/src/main/res/values/styles.xml' --exclude='/app/src/main/res/values-v31/styles.xml' --exclude='/app/src/main/res/drawable/nexus_launch_background.xml' "$PROJECT_DIR/" ./

      - name: Verify controlled version and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.19') process.exit(1); console.log('Package version:',p.version)"
          grep -q 'versionCode 20' app/build.gradle
          grep -q 'versionName "1.0.19"' app/build.gradle
          grep -q 'signingConfigs.release' app/build.gradle
          echo "Android version and release signing configuration verified."

      - name: Save merged project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update NEXUS project from ZIP"
            git push
          else
            echo "No project changes."
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: Verify web project
        run: npm run build

      - name: Restore and validate NEXUS signing key
        shell: bash
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NEXUS_KEYSTORE_BASE64 NEXUS_KEYSTORE_PASSWORD NEXUS_KEY_ALIAS NEXUS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing signing secret: $name"; exit 1; fi
          done
          KEYSTORE="$RUNNER_TEMP/nexus-release.jks"
          printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$NEXUS_KEYSTORE_PASSWORD" -alias "$NEXUS_KEY_ALIAS" >/dev/null
          echo "NEXUS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Signing keystore and alias validated."

      - name: Build signed Release APK
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature matches signing keystore
        shell: bash
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          KEYTOOL_OUTPUT=$(keytool -list -v -keystore "$NEXUS_KEYSTORE_PATH" -storepass "$NEXUS_KEYSTORE_PASSWORD" -alias "$NEXUS_KEY_ALIAS" 2>&1)
          KEY_CERT=$(printf '%s\\n' "$KEYTOOL_OUTPUT" | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          APKSIGNER_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "apksigner certificate report:"
          printf '%s\\n' "$APKSIGNER_OUTPUT"
          APK_CERT=$(printf '%s\\n' "$APKSIGNER_OUTPUT" | grep -iE 'SHA-?256.*digest|digest.*SHA-?256' | head -1 | sed 's/.*:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$KEY_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not extract a valid SHA-256 fingerprint from the keystore report."
            exit 1
          fi
          if [[ ! "$APK_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not extract a valid SHA-256 fingerprint from the APK report."
            exit 1
          fi
          if [[ "$KEY_CERT" != "$APK_CERT" ]]; then
            echo "APK certificate does not match the configured release keystore."
            echo "Keystore SHA-256: $KEY_CERT"
            echo "APK SHA-256: $APK_CERT"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK certificate matches the configured keystore."
          echo "Certificate SHA-256: $APK_CERT"
          ls -lh "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0.19-android16-statusbar-fix
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
