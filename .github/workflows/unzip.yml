name: NEXUS - Merge Project and Build APK

'on':
  workflow_dispatch:
    inputs:
      update_zip:
        description: Select the merged update package
        required: true
        type: choice
        options:
          - NEXUS-1.0.1-merged.zip

permissions:
  contents: write

concurrency:
  group: nexus-apk-build
  cancel-in-progress: false

jobs:
  merge-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract merged project
        shell: bash
        env:
          ZIP_FILE: ${{ inputs.update_zip }}
        run: |
          set -euo pipefail

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p /tmp/nexus-merged
          unzip -q -o "$ZIP_FILE" -d /tmp/nexus-merged

          SOURCE_DIR=""

          while IFS= read -r dir; do
            if [[ -f "$dir/package.json" ]] && \
               [[ -f "$dir/settings.gradle" ]] && \
               [[ -d "$dir/app" ]]; then
              SOURCE_DIR="$dir"
              break
            fi
          done < <(find /tmp/nexus-merged -type f -name package.json -printf '%h\n')

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "ERROR: Complete Android project not found."
            find /tmp/nexus-merged -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found: $SOURCE_DIR"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

      - name: Check Android configuration
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
            settings.gradle

          if ! grep -q 'androidx.appcompat:appcompat' app/build.gradle; then
            sed -i \
              "/dependencies[[:space:]]*{/a\\    implementation 'androidx.appcompat:appcompat:1.7.1'" \
              app/build.gradle
          fi

      - name: Update version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 3', s, count=1)
          s, n2 = re.subn(r"""versionName\s+['"][^'"]+['"]""", 'versionName "1.0.2"', s, count=1)

          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely update Android version.")

          p.write_text(s)
          PY

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '1.0.2';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Save merged project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Integrate NEXUS 1.0.2 merged project"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
