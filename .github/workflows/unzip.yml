name: NEXUS - Merge Project and Build APK

'on':
  workflow_dispatch:
    inputs:
      update_zip:
        description: Select NEXUS update package
        required: true
        type: choice
        options:
          - NEXUS-1.0.3-dark-mode-splash-fix.zip

permissions:
  contents: write

concurrency:
  group: nexus-apk-build
  cancel-in-progress: false

jobs:
  merge-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract NEXUS 1.0.3
        shell: bash
        env:
          ZIP_FILE: ${{ inputs.update_zip }}
        run: |
          set -euo pipefail

          test -f "$ZIP_FILE"

          mkdir -p /tmp/nexus-merged
          unzip -q -o "$ZIP_FILE" -d /tmp/nexus-merged

          SOURCE_DIR=""

          while IFS= read -r dir; do
            if [[ -f "$dir/package.json" ]] && \
               [[ -f "$dir/settings.gradle" ]] && \
               [[ -f "$dir/app/build.gradle" ]] && \
               [[ -f "$dir/app/src/main/assets/public/index.html" ]]; then
              SOURCE_DIR="$dir"
              break
            fi
          done < <(find /tmp/nexus-merged -type f -name package.json -printf '%h\n')

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "ERROR: NEXUS Android project not found."
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

      - name: Verify version and features
        run: |
          set -euo pipefail

          node -e "
          const p=require('./package.json');
          if(p.version !== '1.0.3') {
            throw new Error('Wrong package version: '+p.version);
          }
          "

          grep -q 'versionCode 4' app/build.gradle
          grep -q 'versionName "1.0.3"' app/build.gradle
          grep -q 'nexus-theme-mode' app/src/main/assets/public/index.html
          grep -q 'splash-dot' app/src/main/assets/public/index.html

          echo "NEXUS 1.0.3 verification passed."

      - name: Save merged project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update NEXUS to 1.0.3"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
