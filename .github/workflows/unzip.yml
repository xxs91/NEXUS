name: NEXUS - Auto Detect and Build APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: nexus-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest NEXUS ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(
            find . -maxdepth 1 -type f -name 'NEXUS-*.zip' \
              ! -name '*auto-build.zip' \
              -printf '%T@ %f\n' |
            sort -rn |
            head -1 |
            cut -d' ' -f2-
          )

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No NEXUS ZIP found."
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected: $ZIP_FILE"

      - name: Extract NEXUS project
        env:
          ZIP_FILE: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/nexus-package
          unzip -q -o "$ZIP_FILE" -d /tmp/nexus-package

          SOURCE_DIR=""

          while IFS= read -r dir; do
            if [[ -f "$dir/package.json" ]] &&
               [[ -f "$dir/settings.gradle" ]] &&
               [[ -f "$dir/app/build.gradle" ]] &&
               [[ -d "$dir/app/src/main" ]]; then
              SOURCE_DIR="$dir"
              break
            fi
          done < <(
            find /tmp/nexus-package \
              -type f -name package.json -printf '%h\n'
          )

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "NEXUS Android project not found."
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

      - name: Verify project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")

          CODE=$(
            grep -oE 'versionCode[[:space:]]+[0-9]+' \
              app/build.gradle |
            head -1 |
            grep -oE '[0-9]+'
          )

          NAME=$(
            grep -oE "versionName[[:space:]]*[\"'][^\"']+[\"']" \
              app/build.gradle |
            head -1 |
            sed -E "s/.*[\"']([^\"']+)[\"']/\1/"
          )

          if [[ "$VERSION" != "$NAME" ]]; then
            echo "Version mismatch!"
            echo "Package: $VERSION"
            echo "Android: $NAME"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          echo "NEXUS version: $VERSION"
          echo "Version code: $CODE"

      - name: Save merged project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update NEXUS ${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify web project
        run: npm run build

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-${{ steps.version.outputs.version }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
