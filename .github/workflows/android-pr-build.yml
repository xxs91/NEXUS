name: NEXUS Android Signed Release Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-release:
    name: Build and verify signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Restore and validate original NEXUS signing key
        shell: bash
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NEXUS_KEYSTORE_BASE64 NEXUS_KEYSTORE_PASSWORD NEXUS_KEY_ALIAS NEXUS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing signing secret: $name"; exit 1; fi
          done
          KEYSTORE="$RUNNER_TEMP/nexus-release.jks"
          printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$NEXUS_KEYSTORE_PASSWORD" -alias "$NEXUS_KEY_ALIAS" >/dev/null
          echo "NEXUS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Original signing keystore validated."

      - name: Build signed Release APK
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK uses the original signing certificate and version
        shell: bash
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          KEY_CERT=$(keytool -exportcert -keystore "$NEXUS_KEYSTORE_PATH" -storepass "$NEXUS_KEYSTORE_PASSWORD" -alias "$NEXUS_KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print tolower($1)}')
          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | sed -nE '/certificate SHA-256 digest:/I s/.*certificate SHA-256 digest:[[:space:]]*//p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT="6321bc8dac6a5b79afeb18e077269192a6f735786d58877ed40262b8098a19ab"
          echo "Configured keystore certificate SHA-256: $KEY_CERT"
          echo "Built APK certificate SHA-256:          $APK_CERT"
          echo "Previously recorded certificate SHA-256: $EXPECTED_CERT"
          if [[ -z "$KEY_CERT" || -z "$APK_CERT" || "$KEY_CERT" != "$APK_CERT" ]]; then
            echo "APK was not signed by the configured original keystore."
            exit 1
          fi
          if [[ "$APK_CERT" != "$EXPECTED_CERT" ]]; then
            echo "Configured keystore does not match the previously recorded certificate fingerprint."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.nexus.app' versionCode='22' versionName='1.0.21'"
          echo "Verified original certificate and NEXUS 1.0.21 (22)."

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.0.21-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
